<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="disk" x1="4" y1="32" x2="60" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b45309" stop-opacity="0.5" />
      <stop offset="0.3" stop-color="#f59e0b" />
      <stop offset="0.5" stop-color="#fde68a" />
      <stop offset="0.7" stop-color="#f59e0b" />
      <stop offset="1" stop-color="#b45309" stop-opacity="0.5" />
    </linearGradient>
    <radialGradient id="glow" cx="32" cy="32" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0.45" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <g transform="rotate(-14 32 32)">
    <!-- soft glow around the horizon -->
    <circle cx="32" cy="32" r="22" fill="url(#glow)" />

    <!-- far side of the disk, behind the hole -->
    <path d="M4 32 A28 8 0 0 1 60 32" stroke="url(#disk)" stroke-width="3" stroke-linecap="round" />

    <!-- far side lensed up over the top of the hole -->
    <path d="M18.5 30 A13.5 13.5 0 0 1 45.5 30" stroke="url(#disk)" stroke-width="2.4" stroke-linecap="round" opacity="0.9" />

    <!-- photon ring and the horizon -->
    <circle cx="32" cy="32" r="11.2" stroke="#fde68a" stroke-width="1.2" opacity="0.9" />
    <circle cx="32" cy="32" r="10.4" fill="#000" />

    <!-- near side of the disk, in front of the hole -->
    <path d="M4 32 A28 8 0 0 0 60 32" stroke="url(#disk)" stroke-width="3.6" stroke-linecap="round" />
  </g>
</svg>
